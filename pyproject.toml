[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ilga-graph"
version = "0.1.0"
description = "Scrape Illinois General Assembly data, export to Obsidian vault, and serve via GraphQL."
requires-python = ">=3.10"
dependencies = [
    "alembic",
    "fastapi",
    "uvicorn",
    "strawberry-graphql[fastapi]",
    "requests",
    "beautifulsoup4",
    "pdfplumber",
    "python-dotenv",
    "jinja2",
    "python-multipart",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "itsdangerous",
    "aiosmtplib",
    "markdown",
    "networkx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
    "rich",
    "pre-commit",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]
ml = [
    "polars",
    "pyarrow",
    "scikit-learn",
    "rich",
    "rapidfuzz",
    "networkx",
    "node2vec",
    "shap",
    "scipy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning:aiosqlite.*",
]

[tool.ruff]
target-version = "py310"
# 100 is Ruff's default; keeps lines readable and diff-friendly (change to 120 if you prefer)
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Query resolvers use state/helpers injected by main at runtime
"src/ilga_graph/schema.py" = ["F821"]
# Advocacy helpers: long string literals (email/script copy) kept readable
"src/ilga_graph/advocacy_helpers.py" = ["E501"]
"src/ilga_graph/email_utils.py" = ["E501"]
# Content router: FAQ and copy strings kept on single lines for readability
"src/ilga_graph/routers/content.py" = ["E501"]
# Scripts: path must be set before project imports
"scripts/refresh_member_photos.py" = ["E402"]
"scripts/seed_outreach.py" = ["E402", "E501"]
# Alembic: path and dotenv before app imports
"alembic/env.py" = ["E402"]
