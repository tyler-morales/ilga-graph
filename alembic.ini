# Alembic config for ILGA Graph SQLite DB.
# Run from project root: alembic upgrade head
# DB path comes from ILGA_DB_PATH / ILGA_PROFILE (see alembic/env.py).

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is set in env.py from ILGA_DB_PATH / profile

[post_write_hooks]
# optional: format with ruff
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
