name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      since:
        description: "Receipts window start (YYYY-MM-DD). Default 2025-01-01."
        required: false
        default: "2025-01-01"
        type: string
      note:
        description: "Optional note (logged only; does not skip ingest)."
        required: false
        default: ""
        type: string

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,ml]"

      - name: Lint (ruff check)
        run: ruff check src/ tests/

      - name: Lint (ruff format check)
        run: ruff format --check src/ tests/

      - name: Test
        run: pytest tests/ -v --tb=short -m "not e2e"

  deploy:
    name: Deploy to Vultr
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::error::DEPLOY_HOST is not set. Add it (and DEPLOY_USER, DEPLOY_SSH_KEY) under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/ilga-graph && git pull origin main && bash scripts/deploy-on-server.sh

  ingest-sbe-money:
    name: Ingest SBE money (prod)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::error::DEPLOY_HOST is not set. Add it (and DEPLOY_USER, DEPLOY_SSH_KEY) under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Validate since and log note
        env:
          SINCE_INPUT: ${{ github.event.inputs.since }}
          INGEST_NOTE: ${{ github.event.inputs.note }}
        run: |
          SINCE="${SINCE_INPUT:-2025-01-01}"
          if ! [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::since must be YYYY-MM-DD (got: $SINCE)"
            exit 1
          fi
          echo "SINCE=$SINCE" >> "$GITHUB_ENV"
          echo "Ingest window since=$SINCE"
          if [ -n "$INGEST_NOTE" ]; then
            echo "Note: $INGEST_NOTE"
          fi
      - name: Ingest SBE money via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 60m
          script: |
            cd ~/ilga-graph
            source .venv/bin/activate
            test -f cache/members.json
            make ingest-sbe-money ALSO_DATA_DIR=1 SINCE=${{ env.SINCE }}
            sudo systemctl restart ilga-graph
