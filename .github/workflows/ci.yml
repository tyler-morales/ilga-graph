# Manual SBE money ingest: Actions → CI → Run workflow (dispatch only; never on push).
name: CI
run-name: ${{ github.event_name == 'workflow_dispatch' && format('SBE money ingest since {0} — Actions → CI → Run workflow', github.event.inputs.since) || github.workflow }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      since:
        description: "Receipts window start (YYYY-MM-DD). Default 2025-01-01."
        required: false
        default: "2025-01-01"
        type: string
      deploy_first:
        description: "Run scripts/deploy-on-server.sh first (git pull + install + restart). Leave off if prod is already on main."
        required: false
        default: false
        type: boolean

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,ml]"

      - name: Lint (ruff check)
        run: ruff check src/ tests/

      - name: Lint (ruff format check)
        run: ruff format --check src/ tests/

      - name: Test
        run: pytest tests/ -v --tb=short -m "not e2e"

  deploy:
    name: Deploy to Vultr
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::error::DEPLOY_HOST is not set. Add it (and DEPLOY_USER, DEPLOY_SSH_KEY) under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/ilga-graph && git pull origin main && bash scripts/deploy-on-server.sh

  ingest-sbe-money:
    name: Ingest SBE money (Actions → CI → Run workflow)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::error::DEPLOY_HOST is not set. Add it (and DEPLOY_USER, DEPLOY_SSH_KEY) under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Validate since
        env:
          SINCE_INPUT: ${{ github.event.inputs.since }}
        run: |
          SINCE="${SINCE_INPUT:-2025-01-01}"
          if ! [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::since must be YYYY-MM-DD (got: $SINCE)"
            exit 1
          fi
          echo "SINCE=$SINCE" >> "$GITHUB_ENV"
          echo "Ingest window since=$SINCE deploy_first=${{ github.event.inputs.deploy_first }}"
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Download SBE files on the runner
        timeout-minutes: 45
        env:
          SINCE: ${{ env.SINCE }}
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from pathlib import Path

          from ilga_graph.campaign_finance.download import download_sbe_files

          dest = Path("cache/sbe")
          download_sbe_files(dest, since=date.fromisoformat(os.environ["SINCE"]))
          for name in (
              "Candidates.txt",
              "Committees.txt",
              "CmteCandidateLinks.txt",
              "Receipts.txt",
          ):
              path = dest / name
              print(f"{name} {path.stat().st_size} bytes")
          PY
      - name: Copy SBE files to the Pi
        timeout-minutes: 15
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts || true
          RSH="ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"
          $RSH "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ~/ilga-graph/cache/sbe"
          rsync -avz -e "$RSH" cache/sbe/ "${DEPLOY_USER}@${DEPLOY_HOST}:~/ilga-graph/cache/sbe/"
      - name: Ingest SBE money via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SINCE: ${{ env.SINCE }}
          DEPLOY_FIRST: ${{ github.event.inputs.deploy_first }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 60m
          envs: SINCE,DEPLOY_FIRST
          script: |
            cd ~/ilga-graph
            if [ "${DEPLOY_FIRST}" = "true" ]; then
              bash scripts/deploy-on-server.sh
            fi
            if [ ! -f cache/members.json ]; then
              echo "ERROR: cache/members.json is missing on this server. Prod scrape cache is required before SBE money ingest." >&2
              exit 1
            fi
            if [ ! -s cache/sbe/Receipts.txt ]; then
              echo "ERROR: cache/sbe is missing Receipts.txt. Runner download/rsync must succeed first." >&2
              exit 1
            fi
            source .venv/bin/activate && make ingest-sbe-money ALSO_DATA_DIR=1 FROM_DIR=cache/sbe SINCE="${SINCE:-2025-01-01}"
            sudo systemctl restart ilga-graph
