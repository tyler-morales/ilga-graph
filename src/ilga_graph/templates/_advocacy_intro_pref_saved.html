{# HTMX innerHTML swap: client targets #advocacy-intro-pref-section and replaces with this content. #}
<div class="intro-card__pref-section intro-card__pref-section--saved" aria-live="polite" {% if pref == 'no' %}data-pref="email-only"{% endif %}>
    <p class="intro-card__saved-msg">
        {% if pref == 'no' %}
        Got it — email only. One-click send.
        {% else %}
        Script ready. Let's go.
        {% endif %}
    </p>
    <button type="button" class="intro-card__cta btn btn--primary outreach-phone" id="intro-card-lets-go" aria-label="Scroll to first legislator">
        Let's go →
    </button>
</div>
