{# ── Home only: Share — below What's happening; copy link + native share when available. ── #}
<section class="share-section" id="share" aria-labelledby="share-heading">
    <h2 class="share-section-title" id="share-heading">Share</h2>
    <p class="share-section-intro">Help spread the word.</p>
    <div class="share-section-actions">
        <button type="button"
                class="share-section-btn share-section-btn-copy"
                id="share-copy-btn"
                aria-label="Copy page link to clipboard"
                data-copy-default="Copy link"
                data-copy-done="Copied!">
            <span class="share-section-btn-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </span>
            <span class="share-section-btn-text" id="share-copy-text">Copy link</span>
        </button>
        <button type="button"
                class="share-section-btn share-section-btn-native js-share-native"
                id="share-native-btn"
                aria-label="Share via your device or app"
                hidden>
            <span class="share-section-btn-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            </span>
            <span class="share-section-btn-text">Share</span>
        </button>
    </div>
    <p class="share-section-feedback" id="share-copy-feedback" role="status" aria-live="polite" aria-hidden="true" hidden></p>
</section>
<script>
(function () {
    var section = document.getElementById('share');
    if (!section) return;
    var copyBtn = document.getElementById('share-copy-btn');
    var copyText = document.getElementById('share-copy-feedback');
    var copyLabel = document.getElementById('share-copy-text');
    var defaultLabel = copyBtn && copyBtn.getAttribute('data-copy-default');
    var doneLabel = copyBtn && copyBtn.getAttribute('data-copy-done');

    if (copyBtn && typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
        copyBtn.addEventListener('click', function () {
            var url = window.location.href;
            navigator.clipboard.writeText(url).then(function () {
                if (copyLabel) copyLabel.textContent = doneLabel || 'Copied!';
                if (copyText) {
                    copyText.textContent = 'Link copied to clipboard.';
                    copyText.removeAttribute('hidden');
                    copyText.setAttribute('aria-hidden', 'false');
                }
                copyBtn.setAttribute('aria-pressed', 'true');
                setTimeout(function () {
                    if (copyLabel) copyLabel.textContent = defaultLabel || 'Copy link';
                    if (copyText) {
                        copyText.textContent = '';
                        copyText.setAttribute('hidden', '');
                        copyText.setAttribute('aria-hidden', 'true');
                    }
                    copyBtn.removeAttribute('aria-pressed');
                }, 2500);
            }).catch(function () {
                if (copyText) {
                    copyText.textContent = 'Could not copy. Try selecting the address bar and copying the URL.';
                    copyText.removeAttribute('hidden');
                    copyText.setAttribute('aria-hidden', 'false');
                    setTimeout(function () {
                        copyText.textContent = '';
                        copyText.setAttribute('hidden', '');
                        copyText.setAttribute('aria-hidden', 'true');
                    }, 4000);
                }
            });
        });
    } else if (copyBtn) {
        copyBtn.setAttribute('aria-disabled', 'true');
        copyBtn.disabled = true;
    }

    var nativeBtn = document.querySelector('.js-share-native');
    if (nativeBtn && typeof navigator !== 'undefined' && navigator.share) {
        nativeBtn.removeAttribute('hidden');
        nativeBtn.addEventListener('click', function () {
            var title = document.title || 'The Land of Kei';
            var text = document.querySelector('meta[name="description"]') && document.querySelector('meta[name="description"]').getAttribute('content') || 'Fix Illinois law — allow Kei vehicle registration.';
            navigator.share({
                title: title,
                text: text,
                url: window.location.href
            }).catch(function () {});
        });
    }
})();
</script>
