<script>
(function() {
  function init() {
    var wrap = document.querySelector('.strategic-states-icon-wrap');
    if (!wrap) return;
    var tooltip = wrap.querySelector('.strategic-states-tooltip');
    var triggers = wrap.querySelectorAll('.strategic-states-co, .strategic-states-mi, .strategic-states-tx');
    var leaveTimeout = null;
    var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function positionTooltip(rect) {
      tooltip.style.left = rect.left + rect.width / 2 + 'px';
      tooltip.style.top = rect.top - 8 + 'px';
    }

    function show(state, how, rect) {
      if (leaveTimeout) { clearTimeout(leaveTimeout); leaveTimeout = null; }
      tooltip.textContent = state + ': ' + how;
      tooltip.setAttribute('aria-hidden', 'false');
      tooltip.removeAttribute('hidden');
      positionTooltip(rect);
      tooltip.classList.remove('strategic-states-tooltip--leaving');
      tooltip.offsetHeight;
      tooltip.classList.add('strategic-states-tooltip--visible');
    }

    function hide() {
      tooltip.classList.add('strategic-states-tooltip--leaving');
      tooltip.classList.remove('strategic-states-tooltip--visible');
      var duration = reducedMotion ? 0 : 180;
      leaveTimeout = setTimeout(function() {
        tooltip.setAttribute('aria-hidden', 'true');
        tooltip.setAttribute('hidden', '');
        tooltip.classList.remove('strategic-states-tooltip--leaving');
        leaveTimeout = null;
      }, duration);
    }

    triggers.forEach(function(g) {
      g.addEventListener('mouseenter', function(ev) {
        var state = g.getAttribute('data-state');
        var how = g.getAttribute('data-how');
        if (!state || !how) return;
        var rect = g.getBoundingClientRect();
        show(state, how, rect);
      });
      g.addEventListener('mouseleave', function() { hide(); });
      g.addEventListener('focus', function() {
        var state = g.getAttribute('data-state');
        var how = g.getAttribute('data-how');
        if (!state || !how) return;
        var rect = g.getBoundingClientRect();
        show(state, how, rect);
      });
      g.addEventListener('blur', function() { hide(); });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
