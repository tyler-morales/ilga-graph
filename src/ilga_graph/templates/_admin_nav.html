<script>
(function() {
  var btn = document.querySelector('.admin-nav-logout');
  if (!btn || window.__adminNavLogoutBound) return;
  window.__adminNavLogoutBound = true;
  btn.addEventListener('click', function() {
    fetch('/auth/logout', { method: 'POST', credentials: 'same-origin' })
      .then(function() { window.location.href = '/admin/login'; })
      .catch(function() { window.location.href = '/admin/login'; });
  });
})();
</script>
