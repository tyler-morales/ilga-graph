{% set selected_roles = form_roles or [] %}
{% if status_is_error and status_message %}
<p class="subscribe-email-error" role="alert">{{ status_message }}</p>
{% endif %}
<form action="/intelligence/money/signup" method="post" class="money-signup-form account-form"
    hx-post="/intelligence/money/signup" hx-target="#money-signup-wrap" hx-swap="innerHTML"
    aria-label="Sign up for Illinois follow-the-money intel">
    <input type="hidden" name="csrf_token" value="{{ (request.state.csrf_token or '') if request is defined else '' }}">
    <div class="account-field">
        <label for="money-signup-email">Email <span class="money-signup-required">(required)</span></label>
        <input type="email" id="money-signup-email" name="email" class="input account-input" required
            autocomplete="email" inputmode="email" maxlength="320" value="{{ form_email }}"
            {% if status == 'invalid' %}aria-invalid="true" aria-describedby="money-signup-email-hint"{% endif %}>
        <p id="money-signup-email-hint" class="account-hint">We’ll only use this for money-intel updates. Single opt-in; unsubscribe from any email.</p>
    </div>
    <div class="account-field">
        <label for="money-signup-name">Name <span class="account-hint">(optional)</span></label>
        <input type="text" id="money-signup-name" name="name" class="input account-input" autocomplete="name"
            maxlength="120" value="{{ form_name }}">
    </div>
    <div class="account-field">
        <label for="money-signup-org">Organization or firm <span class="account-hint">(optional)</span></label>
        <input type="text" id="money-signup-org" name="org" class="input account-input" autocomplete="organization"
            maxlength="200" value="{{ form_org }}">
    </div>
    <fieldset class="account-field money-signup-roles">
        <legend>Role <span class="account-hint">(optional)</span></legend>
        {% for slug, label in role_choices %}
        <label class="account-checkbox-label">
            <input type="checkbox" name="role" value="{{ slug }}" class="account-checkbox"
                {% if slug in selected_roles %}checked{% endif %}>
            <span>{{ label }}</span>
        </label>
        {% endfor %}
    </fieldset>
    <button type="submit" class="btn btn--primary">Get updates</button>
</form>
