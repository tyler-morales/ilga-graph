# ILGA Graph — documentation site
# Serve: mkdocs serve   Build: mkdocs build

site_name: ILGA Graph Docs
site_description: Documentation for the ILGA Graph proof-of-concept
site_url: https://github.com/your-org/ilga_graph_poc  # optional

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Features:
    - App overview: features/app-overview.md
  - Architecture:
    - Legislative Ontology: architecture/legislative-ontology.md
  - User guide:
    - Advocacy Test Mode: user-guide/advocacy-test-mode.md
  - Reference:
    - CLI (Make): reference/cli-make.md
    - Deployment: reference/deployment.md
    - Vultr deployment guide: reference/vultr-deployment-guide.md
    - Email (Brevo): reference/email-brevo.md
    - Environment variables: reference/environment-variables.md
    - GraphQL API: reference/graphql.md
    - Performance and resilience: reference/performance-resilience.md
    - Project structure: reference/project-structure.md
    - Status report: reference/status-report.md
  - Development:
    - Design system: development/design-system.md
    - Component playground: development/component-playground.md
    - Data and environments: development/data-and-environments.md
    - Advocacy Test Mode (internals): development/advocacy-test-mode-internals.md
    - Bills-first pipeline testing: development/bills-first-testing.md
    - DB and outreach: development/db-and-outreach.md

plugins:
  - search

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - admonition
  - tables
